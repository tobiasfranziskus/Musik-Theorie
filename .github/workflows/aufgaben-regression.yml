name: Aufgaben-Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-Syntax prüfen
        run: node --check src/app.js
      - name: Noten- und Aufgabentests
        run: node --test tests/aufgaben.test.cjs
